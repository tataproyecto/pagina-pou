<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Asistente Social IA</title>

    <style>
      body {
        margin: 0;
        font-family: "Segoe UI", sans-serif;
        background: radial-gradient(circle at top, #d4c8ed, #ede8f5);
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(30px) scale(0.96);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      @keyframes float {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-8px);
        }
      }

      .phone {
        width: 360px;
        min-height: 720px;
        border-radius: 40px;
        padding: 28px 20px;
        background: #f3effc;
        border: 1px solid #d4c8ed;
        box-shadow: 0 20px 40px rgba(130, 100, 200, 0.15);
        color: #3d2e60;
        box-sizing: border-box;
        animation: fadeIn 0.8s ease;
        margin: 2rem 0;
      }

      .emoji {
        text-align: center;
        font-size: 60px;
        margin-bottom: 10px;
        animation: float 3s infinite ease-in-out;
      }

      h1 {
        font-size: 18px;
        text-align: center;
        margin: 0 0 20px;
        font-weight: 500;
        color: #5a4480;
      }

      label {
        font-size: 13px;
        display: block;
        margin: 14px 0 5px;
        color: #7a62a3;
      }

      input[type="text"] {
        width: 100%;
        padding: 10px 12px;
        border-radius: 10px;
        border: 1px solid #c4b0e8;
        outline: none;
        background: #ede8f8;
        color: #3d2e60;
        font-size: 14px;
        box-sizing: border-box;
        transition:
          background 0.3s,
          box-shadow 0.3s,
          transform 0.3s;
      }

      input[type="text"]::placeholder {
        color: #b0a0cc;
      }

      input[type="text"]:focus {
        background: #e8e2f8;
        border-color: #9b7fd4;
        box-shadow: 0 0 8px rgba(155, 127, 212, 0.3);
        transform: scale(1.02);
      }

      input[type="text"]:disabled {
        opacity: 0.35;
        cursor: not-allowed;
        transform: none !important;
        box-shadow: none !important;
      }

      .radio-group {
        display: flex;
        gap: 10px;
        margin: 8px 0 0;
      }

      .radio-group button {
        flex: 1;
        padding: 10px;
        border-radius: 10px;
        border: 1px solid #c4b0e8;
        background: #ede8f8;
        color: #7a62a3;
        cursor: pointer;
        font-size: 14px;
        transition:
          background 0.3s,
          transform 0.2s;
      }

      .radio-group button:hover {
        background: #e0d8f5;
        transform: scale(1.04);
      }

      .radio-group button.active {
        background: #9b7fd4;
        color: white;
        border-color: #9b7fd4;
        box-shadow: none;
      }

      .med-wrapper {
        overflow: hidden;
        transition:
          max-height 0.45s cubic-bezier(0.4, 0, 0.2, 1),
          opacity 0.35s ease,
          margin 0.35s ease;
        max-height: 80px;
        opacity: 1;
        margin-top: 10px;
      }

      .med-wrapper.hidden {
        max-height: 0;
        opacity: 0;
        margin-top: 0;
      }

      .options {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 12px;
      }

      .card {
        flex: 1;
        min-width: 80px;
        padding: 10px 6px;
        border-radius: 15px;
        text-align: center;
        font-size: 12px;
        cursor: pointer;
        background: #ede8f8;
        border: 1px solid #c4b0e8;
        color: #7a62a3;
        line-height: 1.4;
        transition:
          background 0.3s,
          transform 0.25s;
      }

      .card:hover {
        transform: translateY(-4px) scale(1.04);
        background: #e0d8f5;
      }

      .card.active {
        background: #9b7fd4;
        color: white;
        border-color: #9b7fd4;
        box-shadow: none;
      }

      .btn {
        width: 100%;
        margin-top: 25px;
        padding: 15px;
        border-radius: 25px;
        border: none;
        background: #9b7fd4;
        color: white;
        font-size: 16px;
        cursor: pointer;
        transition:
          transform 0.2s,
          box-shadow 0.2s;
      }

      .btn:hover {
        transform: scale(1.05);
        box-shadow: 0 4px 18px rgba(155, 127, 212, 0.4);
      }

      .btn:active {
        transform: scale(0.97);
      }
    </style>
  </head>

  <body>
    <div class="phone">
      <div class="emoji">😏</div>
      <h1>Nexis Asistente Social IA</h1>

      <label>Nombre</label>
      <input type="text" placeholder="Tu nombre..." />

      <label>¿Tienes medicación?</label>
      <div class="radio-group">
        <button class="active" id="si-btn" onclick="setMed(true)">Sí</button>
        <button id="no-btn" onclick="setMed(false)">No</button>
      </div>

      <div class="med-wrapper" id="med-wrapper">
        <label>Nombre del medicamento</label>
        <input type="text" id="med-input" placeholder="Ej: Sertralina..." />
      </div>

      <label>¿Por cuánto tiempo usarás la app?</label>
      <input type="text" placeholder="Ej: 3 meses, indefinido..." />

      <label>¿Cómo te gustaría usar la app?</label>
      <div class="options">
        <div class="card active" onclick="setUso(this)">💬<br />Consejero</div>
        <div class="card" onclick="setUso(this)">🤝<br />Ayudante</div>
        <div class="card" onclick="setUso(this)">📓<br />Diario</div>
        <div class="card" onclick="setUso(this)">🧘<br />Bienestar</div>
      </div>

      <button class="btn">Continuar</button>
    </div>

    <script>
      function setMed(tiene) {
        document.getElementById("si-btn").classList.toggle("active", tiene);
        document.getElementById("no-btn").classList.toggle("active", !tiene);
        const wrapper = document.getElementById("med-wrapper");
        const inp = document.getElementById("med-input");
        wrapper.classList.toggle("hidden", !tiene);
        inp.disabled = !tiene;
        if (!tiene) inp.value = "";
      }

      function setUso(el) {
        document
          .querySelectorAll(".card")
          .forEach((c) => c.classList.remove("active"));
        el.classList.add("active");
      }
    </script>
  </body>
</html>
