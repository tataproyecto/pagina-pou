<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Asistente Social IA</title>

    <style>
      body {
        margin: 0;
        font-family: "Segoe UI", sans-serif;
        background: radial-gradient(circle at top, #1a0f4a, #0a0030);
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(30px) scale(0.96);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      @keyframes float {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-8px);
        }
      }

      .phone {
        width: 360px;
        min-height: 720px;
        border-radius: 40px;
        padding: 28px 20px;
        background: linear-gradient(180deg, #3a0ca3, #f72585);
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
        color: white;
        box-sizing: border-box;
        animation: fadeIn 0.8s ease;
        margin: 2rem 0;
      }

      .phone::-webkit-scrollbar {
        width: 5px;
      }
      .phone::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.3);
        border-radius: 10px;
      }

      .emoji {
        text-align: center;
        font-size: 60px;
        margin-bottom: 10px;
        animation: float 3s infinite ease-in-out;
      }

      h1 {
        font-size: 18px;
        text-align: center;
        margin: 0 0 20px;
        font-weight: 500;
      }

      label {
        font-size: 13px;
        display: block;
        margin: 14px 0 5px;
        color: rgba(255, 255, 255, 0.9);
      }

      input[type="text"] {
        width: 100%;
        padding: 10px 12px;
        border-radius: 10px;
        border: none;
        outline: none;
        background: rgba(255, 255, 255, 0.2);
        color: white;
        font-size: 14px;
        box-sizing: border-box;
        transition:
          background 0.3s,
          box-shadow 0.3s,
          transform 0.3s;
      }

      input[type="text"]::placeholder {
        color: rgba(255, 255, 255, 0.55);
      }

      input[type="text"]:focus {
        background: rgba(255, 255, 255, 0.35);
        box-shadow: 0 0 10px rgba(255, 255, 255, 0.4);
        transform: scale(1.02);
      }

      input[type="text"]:disabled {
        opacity: 0.35;
        cursor: not-allowed;
        transform: none !important;
        box-shadow: none !important;
      }

      /* Botones Sí / No */
      .radio-group {
        display: flex;
        gap: 10px;
        margin: 8px 0 0;
      }

      .radio-group button {
        flex: 1;
        padding: 10px;
        border-radius: 10px;
        border: none;
        background: rgba(255, 255, 255, 0.2);
        color: white;
        cursor: pointer;
        font-size: 14px;
        transition:
          background 0.3s,
          transform 0.2s;
      }

      .radio-group button:hover {
        background: rgba(255, 255, 255, 0.32);
        transform: scale(1.04);
      }

      .radio-group button.active {
        background: #ff0054;
        box-shadow: 0 0 10px #ff0054;
      }

      /* Campo medicación con animación */
      .med-wrapper {
        overflow: hidden;
        transition:
          max-height 0.45s cubic-bezier(0.4, 0, 0.2, 1),
          opacity 0.35s ease,
          margin 0.35s ease;
        max-height: 80px;
        opacity: 1;
        margin-top: 10px;
      }

      .med-wrapper.hidden {
        max-height: 0;
        opacity: 0;
        margin-top: 0;
      }

      /* Cards de nivel */
      .options {
        display: flex;
        gap: 10px;
        margin-top: 12px;
      }

      .card {
        flex: 1;
        padding: 10px 6px;
        border-radius: 15px;
        text-align: center;
        font-size: 12px;
        cursor: pointer;
        background: rgba(255, 255, 255, 0.2);
        transition:
          background 0.3s,
          transform 0.25s,
          box-shadow 0.25s;
      }

      .card:hover {
        transform: translateY(-4px) scale(1.04);
        background: rgba(255, 255, 255, 0.32);
      }

      .card.active {
        background: linear-gradient(45deg, #ff006e, #ffbe0b);
        box-shadow: 0 0 15px rgba(255, 0, 110, 0.8);
      }

      /* Botón continuar */
      .btn {
        width: 100%;
        margin-top: 25px;
        padding: 15px;
        border-radius: 25px;
        border: none;
        background: linear-gradient(45deg, #ff006e, #ff5400);
        color: white;
        font-size: 16px;
        cursor: pointer;
        transition:
          transform 0.2s,
          box-shadow 0.2s;
      }

      .btn:hover {
        transform: scale(1.05);
        box-shadow: 0 0 20px rgba(255, 0, 110, 0.8);
      }

      .btn:active {
        transform: scale(0.97);
      }
    </style>
  </head>

  <body>
    <div class="phone">
      <div class="emoji">😏</div>

      <h1>Bienvenido a tu Asistente Social IA</h1>

      <label>¿Cómo te gustaría que te llame?</label>
      <input type="text" placeholder="Escribe tu nombre..." />

      <label>¿Por cuánto tiempo te gustaría usar la aplicación?</label>
      <input type="text" placeholder="Escribe tu tiempo estimado..." />

      <label>¿Estás medicado?</label>
      <div class="radio-group" id="medicado">
        <button class="active" data-val="si">Sí</button>
        <button data-val="no">No</button>
      </div>

      <div class="med-wrapper" id="medWrapper">
        <input
          type="text"
          id="medInput"
          placeholder="Escribe tu medicación..."
        />
      </div>

      <label>Nivel de ayuda que necesitas:</label>
      <div class="options" id="nivel">
        <div class="card active">💖<br />Apoyo Básico</div>
        <div class="card">💬<br />Ayuda Moderada</div>
        <div class="card">🛟<br />Asistencia Intensiva</div>
      </div>

      <button class="btn">Continuar</button>
    </div>

    <script>
      // Selección única reutilizable
      function activarSeleccion(grupoId, itemSelector) {
        const grupo = document.getElementById(grupoId);
        const items = grupo.querySelectorAll(itemSelector);
        items.forEach((item) => {
          item.addEventListener("click", () => {
            items.forEach((el) => el.classList.remove("active"));
            item.classList.add("active");
          });
        });
      }

      // Cards de nivel
      activarSeleccion("nivel", ".card");

      // Botones Sí / No con animación del campo medicación
      const btns = document.querySelectorAll("#medicado button");
      const wrapper = document.getElementById("medWrapper");
      const medInput = document.getElementById("medInput");

      btns.forEach((btn) => {
        btn.addEventListener("click", () => {
          btns.forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");

          if (btn.dataset.val === "no") {
            wrapper.classList.add("hidden");
            medInput.disabled = true;
            medInput.value = "";
          } else {
            wrapper.classList.remove("hidden");
            medInput.disabled = false;
          }
        });
      });
    </script>
  </body>
</html>
