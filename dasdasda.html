<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>nexis.ia – Asistente Social IA</title>
    <style>
      /* ────────────────────────
   VARIABLES DE COLOR (violeta / lila / lavanda)
   ──────────────────────── */
      :root {
        --violeta: #7f00ff; /* color principal */
        --lila: #c8a2c8; /* acento */
        --lavanda: #e6e6fa; /* fondo claro */
        --bg-dark: #2b0a3b; /* degradado oscuro */
        --bg-dark2: #3d185f;
      }

      /* ────────────────────────
   ESTILO GLOBAL
   ──────────────────────── */
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: "Segoe UI", sans-serif;
        background: linear-gradient(135deg, var(--bg-dark), var(--bg-dark2));
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      /* ────────────────────────
   CONTENEDOR PRINCIPAL
   ──────────────────────── */
      .app {
        width: 100%;
        max-width: 900px;
        min-height: 80vh;
        display: flex;
        flex-direction: column;
        background: rgba(255, 255, 255, 0.03); /* fondo casi transparente */
        border: 1px solid var(--lila);
        border-radius: 20px;
        overflow: hidden;
      }

      /* ────────────────────────
   BARRA SUPERIOR (estilo Ollama)
   ──────────────────────── */
      header {
        background: var(--violeta);
        color: #fff;
        padding: 0.8rem 1.2rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 1.2rem;
      }
      header .brand {
        font-weight: 600;
      }
      header .model {
        font-size: 0.9rem;
        opacity: 0.8;
      }

      /* ────────────────────────
   PANTALLA DE REGISTRO
   ──────────────────────── */
      .form-screen {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        padding: 2rem;
        background: rgba(255, 255, 255, 0.9);
        border: 2px solid var(--lila);
        border-radius: 16px;
        margin: 1rem;
        animation: fadeIn 0.6s ease;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      .form-screen .emoji {
        font-size: 70px;
        animation: float 3s infinite ease-in-out;
      }
      @keyframes float {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-8px);
        }
      }
      .form-screen h1 {
        font-size: 22px;
        color: #5a4480;
        margin: 0;
      }
      .form-screen label {
        align-self: flex-start;
        font-size: 14px;
        margin-top: 0.6rem;
        color: #7a62a3;
      }
      .form-screen input[type="text"] {
        width: 280px;
        padding: 10px 12px;
        border-radius: 10px;
        border: 1px solid #c4b0e8;
        background: #ede8f8;
        font-size: 14px;
        transition:
          background 0.3s,
          box-shadow 0.3s,
          transform 0.3s;
      }
      .form-screen input[type="text"]:focus {
        background: #e8e2f8;
        border-color: #9b7fd4;
        box-shadow: 0 0 8px rgba(155, 127, 212, 0.3);
        transform: scale(1.02);
      }
      .form-screen .radio-group {
        display: flex;
        gap: 10px;
        margin-top: 0.5rem;
      }
      .form-screen .radio-group button {
        flex: 1;
        padding: 8px;
        border-radius: 10px;
        border: 1px solid #c4b0e8;
        background: #ede8f8;
        color: #7a62a3;
        cursor: pointer;
        transition:
          background 0.3s,
          transform 0.2s;
      }
      .form-screen .radio-group button.active {
        background: #9b7fd4;
        color: #fff;
        border-color: #9b7fd4;
      }
      .form-screen .radio-group button:hover {
        background: #e0d8f5;
        transform: scale(1.04);
      }
      .form-screen .med-wrapper {
        overflow: hidden;
        transition:
          max-height 0.45s cubic-bezier(0.4, 0, 0.2, 1),
          opacity 0.35s;
        max-height: 80px;
        opacity: 1;
        margin-top: 0.6rem;
      }
      .form-screen .med-wrapper.hidden {
        max-height: 0;
        opacity: 0;
        margin-top: 0;
      }
      .form-screen .options {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 0.8rem;
      }
      .form-screen .card {
        flex: 1;
        min-width: 80px;
        padding: 10px 6px;
        border-radius: 15px;
        text-align: center;
        font-size: 12px;
        cursor: pointer;
        background: #ede8f8;
        border: 1px solid #c4b0e8;
        color: #7a62a3;
        transition:
          background 0.3s,
          transform 0.25s;
      }
      .form-screen .card:hover {
        transform: translateY(-4px) scale(1.04);
        background: #e0d8f5;
      }
      .form-screen .card.active {
        background: #9b7fd4;
        color: #fff;
        border-color: #9b7fd4;
      }
      .form-screen .continue-btn {
        margin-top: 1.5rem;
        padding: 0.8rem 1.5rem;
        border-radius: 25px;
        background: #9b7fd4;
        color: #fff;
        border: none;
        font-size: 16px;
        cursor: pointer;
        transition:
          transform 0.2s,
          box-shadow 0.2s;
      }
      .form-screen .continue-btn:hover {
        transform: scale(1.05);
        box-shadow: 0 4px 18px rgba(155, 127, 212, 0.4);
      }

      /* ────────────────────────
   PANTALLA DE CHAT
   ──────────────────────── */
      .chat-screen {
        flex: 1;
        display: flex;
        flex-direction: column;
        background: rgba(255, 255, 255, 0.85);
        border-top: 1px solid var(--lila);
        padding: 0.8rem;
      }
      #chat {
        flex: 1;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 0.6rem;
        padding-right: 5px;
      }
      .message {
        max-width: 85%;
        padding: 0.6rem 1rem;
        border-radius: 1rem;
        line-height: 1.4;
        word-break: break-word;
        opacity: 0;
        transform: translateY(10px);
        animation: enter 0.3s forwards;
      }
      @keyframes enter {
        to {
          opacity: 1;
          transform: none;
        }
      }
      .message.user {
        align-self: flex-end;
        background: var(--lila);
        color: #111;
      }
      .message.assistant {
        align-self: flex-start;
        background: var(--lila);
        color: #111;
      }

      /* cara amarilla al lado del mensaje */
      .msg {
        display: flex;
        align-items: center;
        gap: 0.6rem;
      }
      .small-face {
        width: 28px;
        height: 28px;
        background: #ffeb3b;
        border-radius: 50%;
        position: relative;
      }
      .small-face .eye {
        width: 4px;
        height: 4px;
        background: #000;
        border-radius: 50%;
        position: absolute;
        top: 30%;
      }
      .small-face .eye.l {
        left: 25%;
      }
      .small-face .eye.r {
        right: 25%;
      }
      .small-face .mouth {
        position: absolute;
        left: 50%;
        bottom: 20%;
        transform: translateX(-50%);
        width: 12px;
        height: 6px;
      }
      .small-face.neutral .mouth {
        border-bottom: 2px solid #000;
      }
      .small-face.positive .mouth {
        border-bottom: 3px solid #000;
      }
      .small-face.negative .mouth {
        border-top: 3px solid #000;
        bottom: 30%;
      }

      /* animación “pensando” */
      .typing {
        display: flex;
        align-items: center;
      }
      .typing .dot {
        width: 6px;
        height: 6px;
        background: #555;
        border-radius: 50%;
        margin: 0 2px;
        animation: bounce 0.6s infinite alternate;
      }
      @keyframes bounce {
        to {
          transform: translateY(-6px);
        }
      }

      /* barra inferior (input + botón) */
      .bottom-bar {
        display: flex;
        gap: 0.5rem;
        align-items: center;
        margin-top: 0.4rem;
      }
      #msgInput {
        flex: 1;
        padding: 10px;
        border-radius: 10px;
        border: 1px solid #c4b0e8;
        background: #ede8f8;
        font-size: 14px;
        outline: none;
      }
      .send-btn {
        background: var(--violeta);
        color: #fff;
        border: none;
        border-radius: 10px;
        padding: 10px 16px;
        cursor: pointer;
        font-size: 14px;
        transition:
          background 0.2s,
          transform 0.2s;
      }
      .send-btn:hover {
        background: #5a00c0;
        transform: scale(1.04);
      }
      .send-btn:active {
        transform: scale(0.96);
      }

      /* ocultar secciones */
      .hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="app">
      <!-- ---------- BARRA SUPERIOR (estilo Ollama) ---------- -->
      <header>
        <div class="brand">nexis.ia</div>
        <div class="model">llama3.2:3b</div>
      </header>

      <!-- ---------- PANTALLA DE REGISTRO ---------- -->
      <section class="form-screen" id="formScreen">
        <div class="emoji">😏</div>
        <h1>¡Bienvenido a Nexis!</h1>

        <label>Nombre</label>
        <input type="text" id="nameInput" placeholder="Tu nombre…" />

        <label>¿Tienes medicación?</label>
        <div class="radio-group">
          <button class="active" id="si-btn" onclick="setMed(true)">Sí</button>
          <button id="no-btn" onclick="setMed(false)">No</button>
        </div>

        <div class="med-wrapper" id="med-wrapper">
          <label>Nombre del medicamento</label>
          <input type="text" id="med-input" placeholder="Ej.: Sertralina…" />
        </div>

        <label>¿Por cuánto tiempo usarás la app?</label>
        <input type="text" placeholder="Ej.: 3 meses, indefinido…" />

        <label>¿Cómo te gustaría usar la app?</label>
        <div class="options">
          <div class="card active" onclick="setUso(this)">
            💬<br />Consejero
          </div>
          <div class="card" onclick="setUso(this)">🤝<br />Ayudante</div>
          <div class="card" onclick="setUso(this)">📓<br />Diario</div>
          <div class="card" onclick="setUso(this)">🧘<br />Bienestar</div>
        </div>

        <button class="continue-btn" id="continueBtn">Continuar</button>
      </section>

      <!-- ---------- PANTALLA DE CHAT ---------- -->
      <section class="chat-screen hidden" id="chatScreen">
        <div id="chat"></div>

        <div class="bottom-bar">
          <input
            type="text"
            id="msgInput"
            placeholder="Escribe tu mensaje…"
            autocomplete="off"
          />
          <button class="send-btn" id="sendBtn">Enviar</button>
        </div>
      </section>

      <!-- Sonido de “burbuja” -->
      <audio id="bubbleSound" preload="auto">
        <source
          src="data:audio/mp3;base64,//uQxAALCAAQDABAAAAAAAKxAFAAAANjAAABXODr5NgWjA3ACMAAVc9hNkMPwAAAAA="
          type="audio/mp3"
        />
      </audio>
    </div>

    <script>
      /* ---------- CONFIG ---------- */
      const API_URL = "http://187.127.253.96:11434/api/generate";

      /* ---------- ESTADO ---------- */
      let userData = {}; // datos del registro
      let conversation = []; // historial [{role,text,sentiment}]
      let styleMode = "friendly"; // friendly / caring / compassion

      /* ---------- STORAGE ---------- */
      function saveUser() {
        localStorage.setItem("nexis_user", JSON.stringify(userData));
      }
      function loadUser() {
        return JSON.parse(localStorage.getItem("nexis_user") || "null");
      }
      function saveConversation() {
        localStorage.setItem("nexis_chat", JSON.stringify(conversation));
      }
      function loadConversation() {
        return JSON.parse(localStorage.getItem("nexis_chat") || "[]");
      }

      /* ---------- UI HELPERS (registro) ---------- */
      function setMed(tiene) {
        document.getElementById("si-btn").classList.toggle("active", tiene);
        document.getElementById("no-btn").classList.toggle("active", !tiene);
        const wrapper = document.getElementById("med-wrapper");
        const inp = document.getElementById("med-input");
        wrapper.classList.toggle("hidden", !tiene);
        inp.disabled = !tiene;
        if (!tiene) inp.value = "";
      }
      function setUso(el) {
        document
          .querySelectorAll(".card")
          .forEach((c) => c.classList.remove("active"));
        el.classList.add("active");
      }

      /* ---------- CARA AMARILLA ---------- */
      function createFace(sent) {
        const face = document.createElement("div");
        face.className = `small-face ${sent}`;
        const eyeL = document.createElement("div");
        eyeL.className = "eye l";
        const eyeR = document.createElement("div");
        eyeR.className = "eye r";
        const mouth = document.createElement("div");
        mouth.className = "mouth";
        face.appendChild(eyeL);
        face.appendChild(eyeR);
        face.appendChild(mouth);
        return face;
      }

      /* ---------- ANÁLISIS DE SENTIMIENTO (muy simple) ---------- */
      function analyseSentiment(txt) {
        const pos = [
          "bien",
          "genial",
          "excelente",
          "fantástico",
          "perfecto",
          "gracias",
          "útil",
          "😊",
          "👍",
        ];
        const neg = [
          "mal",
          "malo",
          "error",
          "problema",
          "no puedo",
          "triste",
          "😞",
          "😔",
        ];
        const low = txt.toLowerCase();
        for (const w of pos) if (low.includes(w)) return "positive";
        for (const w of neg) if (low.includes(w)) return "negative";
        return "neutral";
      }

      /* ---------- RENDER DE MENSAJES ---------- */
      function renderMessage(msg) {
        if (msg.role === "user") {
          return `<span>${msg.text}</span>`;
        } else {
          const face = createFace(msg.sentiment || "neutral");
          return `<div class="msg"><div>${face.outerHTML}</div><div class="text">${msg.text}</div></div>`;
        }
      }
      function addMessage(role, html) {
        const cont = document.createElement("div");
        cont.className = `message ${role}`;
        cont.innerHTML = html;
        const chat = document.getElementById("chat");
        chat.appendChild(cont);
        chat.scrollTop = chat.scrollHeight;
      }
      function addChatMessage(msgObj, playSound = true) {
        addMessage(msgObj.role, renderMessage(msgObj));
        if (playSound && msgObj.role === "user") {
          const snd = document.getElementById("bubbleSound");
          snd.currentTime = 0;
          snd.play();
        }
        conversation.push(msgObj);
        saveConversation();
      }

      /* ---------- ANIMACIÓN “PENSANDO” ---------- */
      function showThinking() {
        const face = createFace("neutral");
        const typing = `<div class="typing"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>`;
        const html = `<div class="msg"><div>${face.outerHTML}</div>${typing}</div>`;
        const cont = document.createElement("div");
        cont.className = "message assistant";
        cont.innerHTML = html;
        const chat = document.getElementById("chat");
        chat.appendChild(cont);
        chat.scrollTop = chat.scrollHeight;
        return cont; // lo quitaremos más tarde
      }

      /* ---------- SALUDO INICIAL ---------- */
      function greetUser() {
        const txt = `¡Hola ${userData.name}! Soy nexis.ia y estoy aquí para ${styleMode} ayudarte.`;
        addChatMessage(
          { role: "assistant", text: txt, sentiment: "neutral" },
          false,
        );
      }

      /* ---------- PETICIÓN A OLLAMA ---------- */
      async function askLLM(prompt) {
        const payload = { model: "llama3.2:3b", prompt, stream: false };
        try {
          const r = await fetch(API_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });
          if (!r.ok) throw new Error(`HTTP ${r.status}`);
          const data = await r.json();
          return data.response ?? "[Sin respuesta]";
        } catch (e) {
          console.error(e);
          return `Error: ${e.message}`;
        }
      }

      /* ---------- ENVIAR MENSAJE ---------- */
      async function sendMessage() {
        const input = document.getElementById("msgInput");
        const txt = input.value.trim();
        if (!txt) return;
        addChatMessage({ role: "user", text: txt }, true);
        input.value = "";

        const thinking = showThinking();
        const reply = await askLLM(txt);
        thinking.remove();

        const sentiment = analyseSentiment(reply);
        addChatMessage({ role: "assistant", text: reply, sentiment }, false);
      }

      /* ---------- INICIALIZAR APP ---------- */
      function init() {
        const savedUser = loadUser();
        const savedConv = loadConversation();

        if (savedUser && savedConv.length) {
          /* Ya hay datos → saltamos al chat directamente */
          userData = savedUser;
          conversation = savedConv;
          document.getElementById("formScreen").classList.add("hidden");
          document.getElementById("chatScreen").classList.remove("hidden");

          // renderizamos historial sin reproducir sonidos
          savedConv.forEach((m) => addChatMessage(m, false));

          // definir modo de respuesta según la opción elegida
          const h = userData.help || "";
          if (h.includes("Consejero")) styleMode = "friendly";
          else if (h.includes("Ayudante")) styleMode = "caring";
          else if (h.includes("Diario")) styleMode = "compassion";
          else styleMode = "friendly";
        } else {
          /* Primera visita → mostramos el registro */
          document.getElementById("formScreen").classList.remove("hidden");
          document.getElementById("chatScreen").classList.add("hidden");
        }
      }
      document.addEventListener("DOMContentLoaded", init);

      /* ---------- EVENTOS ---------- */
      // Registro → pasar al chat
      document.getElementById("continueBtn").addEventListener("click", () => {
        const name = document.getElementById("nameInput").value.trim();
        if (!name) {
          alert("Introduce tu nombre");
          return;
        }

        const hasMed = document
          .getElementById("si-btn")
          .classList.contains("active");
        const med = hasMed
          ? document.getElementById("med-input").value.trim()
          : "";
        const card = document.querySelector(".card.active");
        const help = card ? card.textContent.trim() : "Consejero";

        // Definir tono de respuesta
        if (help.includes("Consejero")) styleMode = "friendly";
        else if (help.includes("Ayudante")) styleMode = "caring";
        else if (help.includes("Diario")) styleMode = "compassion";
        else styleMode = "friendly";

        // Guardar datos y limpiar historial anterior (comenzamos de cero)
        userData = { name, hasMed, med, help };
        saveUser();
        conversation = [];
        saveConversation();

        // Cambiar pantalla
        document.getElementById("formScreen").classList.add("hidden");
        document.getElementById("chatScreen").classList.remove("hidden");

        // Saludo inicial
        greetUser();
      });

      // Envío de mensaje
      document.getElementById("sendBtn").addEventListener("click", sendMessage);
      document.getElementById("msgInput").addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          sendMessage();
        }
      });
    </script>
  </body>
</html>
